<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Precios de los alimentos{% endblock %} · Food Price Watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="{{ url_for('dashboard') }}">Food Price</a>
            <nav aria-label="Principal">
                <a href="{{ url_for('dashboard') }}" {% if request.endpoint in ('dashboard', 'pais', 'detalle') %}aria-current="page"{% endif %}>Datos</a>
                <a href="{{ url_for('graficas') }}" {% if request.endpoint == 'graficas' %}aria-current="page"{% endif %}>Gráficos</a>
            </nav>
        </div>
    </header>
    <section class="hero">
        <div class="wrap">{% block hero %}{% endblock %}</div>
    </section>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
    <footer class="wrap site-footer">
        Fuente: FAO, <em>FAOSTAT – Consumer Price Indices</em>. Food and Agriculture Organization of the United Nations
    </footer>
</body>
</html>
